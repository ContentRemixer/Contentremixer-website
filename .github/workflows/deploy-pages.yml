name: Deploy marketing site to GitHub Pages

# Builds the Astro marketing site and publishes it to GitHub Pages.
# One-time setup by a repo admin: Settings → Pages → Build and deployment → Source = "GitHub Actions".
#
# This deploys the site as a PROJECT page at
#   https://contentremixer.github.io/Contentremixer-website/
# To serve it from a custom domain (e.g. contentremixer.dev) or an org root page instead,
# set BASE_PATH to "/" below and add a public/CNAME file with the domain.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'      # the VitePress docs tree is a separate surface
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (project-page base path)
        env:
          # Project page lives under /<repo>. Set to "/" for a custom domain or org root page.
          BASE_PATH: /Contentremixer-website
          SITE_URL: https://contentremixer.github.io
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
