<svg viewBox="0 0 560 28" width="560" height="28" xmlns="http://www.w3.org/2000/svg" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
  <!-- flat-square, 20px tall badges on a transparent strip. Label side = ink #1A1235, value side = brand token. -->
  <!-- badge 1: build · passing (violet) -->
  <g transform="translate(0,4)">
    <rect width="54" height="20" fill="#1A1235"/><rect x="54" width="66" height="20" fill="#7C3AED"/>
    <text x="27" y="14" fill="#F5F3FF" text-anchor="middle">build</text>
    <text x="87" y="14" fill="#F5F3FF" text-anchor="middle">passing</text>
  </g>
  <!-- badge 2: license · MIT (magenta accent) -->
  <g transform="translate(130,4)">
    <rect width="54" height="20" fill="#1A1235"/><rect x="54" width="40" height="20" fill="#EC4899"/>
    <text x="27" y="14" fill="#F5F3FF" text-anchor="middle">license</text>
    <text x="74" y="14" fill="#F5F3FF" text-anchor="middle">MIT</text>
  </g>
  <!-- badge 3: docs · ContentRemixer (violet) -->
  <g transform="translate(234,4)">
    <rect width="40" height="20" fill="#1A1235"/><rect x="40" width="100" height="20" fill="#7C3AED"/>
    <text x="20" y="14" fill="#F5F3FF" text-anchor="middle">docs</text>
    <text x="90" y="14" fill="#F5F3FF" text-anchor="middle">read the guide</text>
  </g>
  <!-- badge 4: status · active (orange accent, use sparingly) -->
  <g transform="translate(384,4)">
    <rect width="48" height="20" fill="#1A1235"/><rect x="48" width="48" height="20" fill="#F97316"/>
    <text x="24" y="14" fill="#F5F3FF" text-anchor="middle">status</text>
    <text x="72" y="14" fill="#1A1235" text-anchor="middle">active</text>
  </g>
</svg>
